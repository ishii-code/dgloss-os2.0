name: release

# dgloss標準 RELEASE.md：main/開発ブランチへのマージで semantic-release が
# 版数決定・CHANGELOG生成・タグ・GitHub Release を自動実行する。
on:
  push:
    branches: [claude/diglos-knowledge-system-mk9r6t, main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install semantic-release
        run: npm install -g semantic-release @semantic-release/changelog @semantic-release/git
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
